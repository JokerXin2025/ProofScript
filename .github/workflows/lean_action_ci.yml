name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Page component regression
        run: python3 scripts/test-page-components.py
      - name: Install renderer dependencies
        run: python3 -m pip install ./tools/ps4html
      - name: Reference collection regression
        run: python3 scripts/test-references.py
