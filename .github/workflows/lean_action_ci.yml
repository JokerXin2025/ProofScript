name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build optional Embed script
        run: lake build ProofScript.Script.Embed
      - name: Lean language server integration
        run: python3 -m unittest Test.test_language_server -v
