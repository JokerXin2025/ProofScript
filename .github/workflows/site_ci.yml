name: Site syntax

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for script in tools/ps4html/PS4HTML/assets/js/*.js scripts/*.mjs; do
            node --check "$script"
          done
