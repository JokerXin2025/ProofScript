name: Site tools

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ./tools/ps4html jsonschema
      - name: Missing recorder rendering
        run: python -m unittest Test/test_unrecorded.py
      - name: Single-pass site build workflow
        run: python -m unittest Test/test_ps4html_build.py
      - name: Metadata scope and snapshot associations
        run: python -m unittest Test/test_metadata_scope.py
      - name: JavaScript syntax
        run: |
          for script in tools/ps4html/PS4HTML/assets/js/*.js scripts/*.mjs; do
            node --check "$script"
          done
      - name: Computation build paths
        run: node --test Test/test_computation_build_paths.mjs
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Lean verification mode
        run: lake build
      - name: Page resource tools
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-science dvisvgm
      - name: Lean page mode
        run: lake build TestPage:pageTests
      - name: Page mode across user packages
        run: python -m unittest Test/test_page_mode_integration.py
      - name: Lean to HTML integration
        working-directory: examples/site
        run: |
          lake update
          lake build PS4HTMLDemo:ps4html
          python -m PS4HTML make --cache
          node ../../scripts/test-finalized-computation.mjs .PS4HTML/inputs/PS4HTMLDemo/PS4HTMLDemo/.ProofScript/pages/PS4HTMLDemo/Fibonacci.json
