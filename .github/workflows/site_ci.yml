name: Site tools

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ./tools/ps4html jsonschema
      - name: JavaScript syntax
        run: |
          for script in tools/ps4html/PS4HTML/assets/js/*.js scripts/*.mjs; do
            node --check "$script"
          done
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Lean to HTML integration
        working-directory: examples/site
        run: |
          lake update
          lake build PS4HTMLDemo:ps4html
          python ../../scripts/check-site-contract.py .
          python ../../scripts/check-site-http.py .
