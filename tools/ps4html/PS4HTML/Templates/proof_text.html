<section class="proof-text-card">
  <button class="flip-btn proof-text-flip-button" type="button" title="查看 ProofText 源代码" data-front-title="查看 ProofText 源代码" data-back-title="返回渲染结果">
    <i class="codicon codicon-file-code"></i>
  </button>
  <div class="proof-flip-inner proof-text-flip-inner">
    <div class="proof-flip-front">
      <div class="proof-text">${content}</div>
    </div>
    <div class="proof-flip-back">
      <div class="code-header"><span>ProofText</span></div>
      <pre><code>${source}</code></pre>
    </div>
  </div>
</section>
