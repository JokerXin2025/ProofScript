<figure class="page-media page-media-latex" id="${anchor}" data-extra="${extra}">
  <button class="flip-btn page-media-flip-button" type="button" title="查看 LaTeX 源代码" data-front-title="查看 LaTeX 源代码" data-back-title="返回渲染结果">
    <i class="codicon codicon-file-code"></i>
  </button>
  <div class="page-media-stage">
    <div class="proof-flip-inner page-media-flip-inner">
      <div class="proof-flip-front page-media-flip-front">
        <img src="${uri}" alt="${alt}">
      </div>
      <div class="proof-flip-back page-media-flip-back">
        <div class="code-header"><span>LaTeX</span></div>
        <pre><code>${source}</code></pre>
      </div>
    </div>
  </div>
  <figcaption>${title}</figcaption>
</figure>
