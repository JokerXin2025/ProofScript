<figure class="diagram-figure inline-latex-figure" id="${anchor}" data-extra="${extra}">
  <div class="diagram-zoom-bar">
    <input type="range" min="50" max="400" value="100" step="10" class="diagram-zoom" aria-label="缩放图像">
    <span class="diagram-zoom-value">100%</span>
  </div>
  <div class="diagram-zoom-stage">
    ${svg_code}
  </div>
  <figcaption>${title}</figcaption>
</figure>
